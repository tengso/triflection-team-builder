name: Publish images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release tag, for example 0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_ROOT: ghcr.io/tengso/triflection-team-builder
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate release version
        run: |
          python - <<'PY'
          import os, re
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[a-z0-9.-]+)?', os.environ['VERSION']):
              raise SystemExit('Version must be a semantic version, not latest or a branch')
          PY
      - name: Test builder
        run: |
          python -m pip install '.[dev]'
          pytest -q
          ruff check src tests packaging
          ruff format --check src tests packaging
      - name: Prepare pinned upstream sources
        run: python packaging/prepare_images.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject existing release tags
        run: |
          for name in buzz hermes; do
            if docker buildx imagetools inspect "$IMAGE_ROOT/$name:$VERSION" >/dev/null 2>&1; then
              echo "Image tag already exists: $name:$VERSION. Use a new version."
              exit 1
            fi
          done
      - name: Build and publish Buzz
        id: buzz
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .image-build/buzz
          file: packaging/Dockerfile.buzz
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_ROOT }}/buzz:build-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=buzz
          cache-to: type=gha,mode=max,scope=buzz,ignore-error=true,timeout=2m
          provenance: mode=max
          sbom: true
      - name: Build and publish Hermes runtime
        id: hermes
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .image-build/hermes
          file: packaging/Dockerfile.hermes
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_ROOT }}/hermes:build-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            BUZZ_IMAGE=${{ env.IMAGE_ROOT }}/buzz@${{ steps.buzz.outputs.digest }}
          cache-from: type=gha,scope=hermes
          cache-to: type=gha,mode=max,scope=hermes,ignore-error=true,timeout=2m
          provenance: mode=max
          sbom: true
      - name: Verify published images and bootstrap
        env:
          EXERCISE_MANAGEMENT: "1"
          BUZZ_IMAGE: ${{ env.IMAGE_ROOT }}/buzz@${{ steps.buzz.outputs.digest }}
          HERMES_IMAGE: ${{ env.IMAGE_ROOT }}/hermes@${{ steps.hermes.outputs.digest }}
        run: python tests/integration/bootstrap_images.py
      - name: Promote verified images to release tags
        env:
          BUZZ_IMAGE: ${{ env.IMAGE_ROOT }}/buzz@${{ steps.buzz.outputs.digest }}
          HERMES_IMAGE: ${{ env.IMAGE_ROOT }}/hermes@${{ steps.hermes.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE_ROOT/buzz:$VERSION" "$BUZZ_IMAGE"
          docker buildx imagetools create --tag "$IMAGE_ROOT/hermes:$VERSION" "$HERMES_IMAGE"
      - name: Write immutable image manifest
        env:
          BUZZ_IMAGE: ${{ env.IMAGE_ROOT }}/buzz@${{ steps.buzz.outputs.digest }}
          HERMES_IMAGE: ${{ env.IMAGE_ROOT }}/hermes@${{ steps.hermes.outputs.digest }}
        run: |
          python - <<'PY'
          import json, os
          manifest = {k.lower(): os.environ[k] for k in ('VERSION', 'BUZZ_IMAGE', 'HERMES_IMAGE', 'GITHUB_SHA')}
          with open('images.json', 'w') as f:
              json.dump(manifest, f, indent=2)
              f.write('\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('Verified Linux amd64 images:\n```json\n' + json.dumps(manifest, indent=2) + '\n```\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: images-${{ env.VERSION }}
          path: images.json
