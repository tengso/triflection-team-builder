name: Mirror cached release dependencies
on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: Temporary download URL for the checksum-pinned dependency archive
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Recover pinned upstream Linux amd64 images
        env:
          DEPENDENCY_ARCHIVE_URL: ${{ inputs.archive_url }}
        run: |
          curl --fail --location --proto =https --output team-builder-minio-dependencies.tar "$DEPENDENCY_ARCHIVE_URL"
          echo '9b233514f09dfba06592e10de0c1df4ce8ecb3409cc0e8b0ea5e75e3fb72075f  team-builder-minio-dependencies.tar' | sha256sum -c -
          docker load -i team-builder-minio-dependencies.tar
          docker tag sha256:69b2ec208575b69597784255eec6fa6a2985ee9e1a47f4411a51f7f5fdd193a9 ghcr.io/tengso/triflection-team-builder/buzz:dependency-minio-0.6.0
          docker tag sha256:c2ad77420d33bb4ad8694457d3edf7188076428582bd24e3dd4d09d6a1d52872 ghcr.io/tengso/triflection-team-builder/buzz:dependency-mc-0.6.0
          docker push ghcr.io/tengso/triflection-team-builder/buzz:dependency-minio-0.6.0
          docker push ghcr.io/tengso/triflection-team-builder/buzz:dependency-mc-0.6.0
          docker image inspect ghcr.io/tengso/triflection-team-builder/buzz:dependency-minio-0.6.0 ghcr.io/tengso/triflection-team-builder/buzz:dependency-mc-0.6.0 --format '{{json .RepoDigests}}'
