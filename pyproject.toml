[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "buzz-team-builder"
version = "0.5.1"
description = "Bootstrap a conversational Buzz team managed by Chief of Agents"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "coincurve>=20,<22", "PyYAML>=6,<7", "bech32>=1.2,<2", "mcp>=1.10,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[project.scripts]
team-builder = "team_builder.cli:main"
team-builder-manager = "team_builder.server:main"
team-builder-mcp = "team_builder.mcp:main"
team-builder-worker = "team_builder.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
team_builder = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an isolated Linux Docker deployment"]

[tool.ruff]
target-version = "py312"
